apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-app
  template:
    metadata:
      labels:
        app: task-app
    spec:
      containers:
        - name: task-app
          image: shubhadashingane/new-practice-task:latest
          ports:
            - containerPort: 8081